[package]
name = "mahoquot-gateway"
version.workspace = true
edition.workspace = true

[lib]
name = "mahoquot_gateway"
path = "src/lib.rs"

[[bin]]
name = "mahoquot-gateway"
path = "src/main.rs"

[dependencies]
bcrypt = "0.15.1"
rustls-pemfile.workspace = true
tokio-rustls.workspace = true
multer = "3.1"
webrtc = "0.14"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
lazy_static = "1.4"
sha2 = "0.10"
chrono.workspace = true
tower.workspace = true
mahoquot-types.workspace = true
mahoquot-registry.workspace = true
mahoquot-router.workspace = true
mahoquot-providers.workspace = true
tokio.workspace = true
axum = { workspace = true, features = ["http2"] }
hyper.workspace = true
hyper-util.workspace = true
http-body.workspace = true
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
arc-swap.workspace = true
reqwest.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
rand.workspace = true
base64.workspace = true
uuid.workspace = true
jsonwebtoken.workspace = true
prost.workspace = true
prost-types.workspace = true
clap.workspace = true
rusqlite = { version = "0.31", features = ["bundled"] }
ring = "0.17"
hex.workspace = true
urlencoding = "2.1"
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
ed25519-dalek.workspace = true

