name: Model Catalog Workflow

on:
  pull_request:
    paths:
      - "crates/registry/catalog/**"
      - "crates/registry/schema/**"
      - "crates/registry/**"
      - "tools/model-catalog/**"
      - "tests/fixtures/**"
      - "scripts/verify-catalog.sh"
      - ".github/workflows/model-catalog.yml"
  push:
    branches:
      - main
    paths:
      - "crates/registry/catalog/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to model-catalog-v1 branch"
        type: boolean
        default: true

concurrency:
  group: model-catalog-v1
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Validate Catalog & Test Tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate catalog domain and schema invariants
        run: |
          cargo run -p mahoquot-model-catalog -- validate crates/registry/catalog/models-v1.json

      - name: Run verification script (validate -> sign -> verify pipeline)
        run: |
          bash scripts/verify-catalog.sh

      - name: Run test suite for catalog tooling
        run: |
          cargo test -p mahoquot-registry --test envelope_tests
          cargo test -p mahoquot-model-catalog

  publish-catalog:
    name: Publish Signed Catalog to model-catalog-v1
    needs: validate-and-test
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    environment: catalog-publication
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build catalog tooling
        run: |
          cargo build --release -p mahoquot-model-catalog

      - name: Sign and publish catalog
        env:
          MAHOQUOT_MODEL_CATALOG_ED25519_PRIVATE_KEY: ${{ secrets.MAHOQUOT_MODEL_CATALOG_ED25519_PRIVATE_KEY }}
        run: |
          bash scripts/publish-catalog.sh \
            "$PWD/target/release/mahoquot-model-catalog" \
            "$PWD/crates/registry/catalog/models-v1.json" mahoquot-prod-2026-v1
