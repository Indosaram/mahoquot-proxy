name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --bin mahoquot-gateway --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/mahoquot-gateway"
          if [ -f "$BIN_PATH" ]; then
            strip "$BIN_PATH" || true
            tar -czf "mahoquot-gateway-${{ matrix.target }}.tar.gz" -C "$(dirname "$BIN_PATH")" mahoquot-gateway
          else
            strip target/release/mahoquot-gateway || true
            tar -czf "mahoquot-gateway-${{ matrix.target }}.tar.gz" -C target/release mahoquot-gateway
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "mahoquot-gateway-${{ matrix.target }}.tar.gz" > "mahoquot-gateway-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "mahoquot-gateway-${{ matrix.target }}.tar.gz" > "mahoquot-gateway-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mahoquot-gateway-${{ matrix.target }}.tar.gz
            mahoquot-gateway-${{ matrix.target }}.tar.gz.sha256
